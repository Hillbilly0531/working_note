spring:
  profiles: test
  datasource:
    dynamic:
      enabled: true
      primary: master 
      strict: false 
      #p6spy: false
      datasource:
        master:
          driver-class-name: com.p6spy.engine.spy.P6SpyDriver
          url: jdbc:p6spy:mysql://192.168.27.54:3306/db_stock?serverTimezone=GMT%2B8&autoReconnect=true&useSSL=false&allowMultiQueries=true
          username: root
          password: ${MYSQL_PASSWORD}
          type: com.zaxxer.hikari.HikariDataSource
          hikari:
            minIdle: 10
            maxLifetime: 1765000
            maxPoolSize: 100
            idleTimeout: 600000
            leak-detection-threshold: 600000
        slave_1:
          driver-class-name: com.p6spy.engine.spy.P6SpyDriver
          url: jdbc:p6spy:mysql://192.168.27.54:3306/db_stock?serverTimezone=GMT%2B8&autoReconnect=true&useSSL=false&allowMultiQueries=true
          username: root
          password: ${MYSQL_PASSWORD}
          type: com.zaxxer.hikari.HikariDataSource
          hikari:
            minIdle: 10
            maxLifetime: 1765000
            maxPoolSize: 100
            idleTimeout: 600000
            leak-detection-threshold: 600000
        tidb:
          driver-class-name: com.p6spy.engine.spy.P6SpyDriver
          url: jdbc:p6spy:mysql://192.168.27.54:3306/db_biz_dc?serverTimezone=GMT%2B8&autoReconnect=true&useSSL=false&allowMultiQueries=true
          username: root
          password: ${MYSQL_PASSWORD}
          type: com.zaxxer.hikari.HikariDataSource
          hikari:
            minIdle: 10
            maxLifetime: 1765000
            maxPoolSize: 100
            idleTimeout: 600000
            leak-detection-threshold: 600000
      strategy: com.baomidou.dynamic.datasource.strategy.LoadBalanceDynamicDataSourceStrategy